[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-voice-bridge"
version = "0.1.0.dev0"
description = "Phone-call approvals for AI coding agents (Claude Code, OpenAI Codex) over internet SIP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agent Voice Bridge contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
avb-bridge = "agent_voice_bridge.api.server:main"
avb-hook = "agent_voice_bridge.agents.hook:main"
avb-codex = "agent_voice_bridge.agents.codex.cli:main"
avb-admin = "agent_voice_bridge.admin:main"
avb-voice-sim = "agent_voice_bridge.voice.simulator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_voice_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# E501: `ruff format` owns line length; long string literals are left intact.
ignore = ["S101", "E501", "SIM105", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agent_voice_bridge"]
